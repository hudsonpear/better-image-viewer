[package]
name = "better-image-viewer"
version = "1.0.2"
description = "A Better Image Viewer"
authors = ["pyrus"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = false

# Image decoding is ~25x slower with unoptimized dependencies, which made
# `tauri dev` feel broken on large photos (a 53MP JPEG: 29s vs 1.2s). Optimize
# the dependencies only — this crate stays unoptimized, so rebuilds stay quick.
[profile.dev.package."*"]
opt-level = 3

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "image_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# test-only: generates QR codes to check the scanner reads them back
qrcode = { version = "0.14", default-features = false }
# used by examples/make_samples.rs to write an animated PNG
png = "0.17"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
# Opening a file from Explorer hands its path to the window that is already
# running instead of paying a full process + WebView2 cold start every time.
tauri-plugin-single-instance = "2"
# SIMD downscaling for thumbnails and the adjustment preview. Same Lanczos3
# result as image's own resize, but vectorised.
fast_image_resize = "5"
# PSD and KTX2 are read whole; mapping them keeps a multi-gigabyte PSB out of
# the process heap.
memmap2 = "0.9"
# Folder watching, so files appearing or vanishing update the open list.
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
natord = "1.0.9"
image = { version = "0.25.9", features = ["ico", "tiff", "png", "jpeg", "webp", "tiff", "bmp", "exr", "hdr"] }
# JPEG XL, pure Rust
jxl-oxide = "0.12"
# Photoshop files: flattened composite plus the layer list
psd = "0.3"
# Camera raw decoded and demosaiced in Rust, so no Windows codec is needed
imagepipe = "0.5"
rawler = "0.6"
# KTX2 texture containers; the block data is decoded by image_dds
ktx2 = "0.5"
# Image Controls panel: sharpen/threshold/morphology, and colour work done in
# Oklab so brightness and saturation stay perceptually even
imageproc = "0.27"
palette = "0.7"
ico = "0.5.0"
resvg = "0.45.1"
tiny-skia = "0.11.4"
usvg = "0.36.0"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
trash = "5.2.5"
wallpaper = "3.2.0"
rexif = "0.7.5"
little_exif = "0.6.23"
tauri-plugin-clipboard-manager = "2.3.2"
# ZXing port. A lighter decoder (rqrr) could not read real-world printed codes:
# small, colour-printed and scanned ones failed at every preprocessing.
rxing = { version = "0.7", default-features = false }
# DDS textures: BC1-BC7 block formats, mipmaps and cubemap faces
image_dds = "0.7"
image-webp = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
winapi = { version = "0.3.9", features = [
    "winver",
    "shellapi", 
    "wingdi",
    "windef", 
    "winuser",
    "libloaderapi",
    "errhandlingapi"
] }
urlencoding = "2.1.3"
windows-sys = { version = "0.52", features = [
  "Win32_UI_Shell",
  "Win32_Foundation"
] }
# WIC: Windows' own image decoder, used as a fallback for files the `image`
# crate can't read (old-style JPEG in TIFF, libtiff-era LZW, CMYK, tiled, ...)
windows = { version = "0.61", features = [
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  # Windows' built-in OCR engine (Text menu item)
  "Media_Ocr",
  "Globalization",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation",
  "Foundation_Collections"
] }
